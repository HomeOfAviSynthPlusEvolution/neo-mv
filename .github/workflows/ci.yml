name: CI

on:
  push:
    branches: [debug/windows-arm64-metric]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-metric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-metric:
    name: Windows ARM64 / metric diagnostic
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G "Visual Studio 18 2026" -A ARM64 -T ClangCL
          -DBUILD_TESTING=ON -DNEO_MV_ENABLE_HIGHWAY=ON
          -DNEO_MV_BUILD_VAPOURSYNTH=OFF -DNEO_MV_BUILD_AVISYNTH=OFF
          -DNEO_MV_TEST_VAPOURSYNTH=OFF -DNEO_MV_TEST_BLACKBOX=OFF
          -DNEO_MV_BUILD_BENCHMARKS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DDS_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build metric test
        run: cmake --build build/ci --config Release --target neo_mv_highway_tests --parallel 4
      - name: Run metric differential
        run: ctest --test-dir build/ci -C Release -R "^core.highway$" --verbose --output-on-failure --no-tests=error
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-metric
          path: |
            build/ci/Testing/Temporary/LastTest.log
            build/ci/Release/neo_mv_highway_tests.exe
          if-no-files-found: warn

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 / clang-cl
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build/ci -G "Visual Studio 18 2026" -A x64 -T ClangCL
          -DBUILD_TESTING=OFF -DNEO_MV_BUILD_BENCHMARKS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DDS_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build/ci --config Release --target neo_mv_vs --parallel 4

      - name: Prepare download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/experimental -Force | Out-Null
          Copy-Item build/ci/Release/neo-mv.dll, docs/experimental-recalculate.md, LICENSE build/experimental/ -ErrorAction Stop

      - name: Upload experimental plugin
        uses: actions/upload-artifact@v7
        with:
          name: neo-mv-windows-x64-clang-cl-${{ github.sha }}
          path: build/experimental/*
          if-no-files-found: error
